services:
  api:
    build:
      context: ./src/Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=JiraLite;User Id=sa;Password=${SA_PASSWORD:-Dev_OnlyPassw0rd!};TrustServerCertificate=True"
      Jwt__SigningKey: "dev-only-signing-key-not-for-production-use-1234567890"
      FileStorage__RootPath: "/app/storage"
      # spec/20-coding-guidelines.md §9 names the local Compose stack alongside Development as the
      # one place migrations may be applied on startup. Set here rather than inherited from
      # appsettings.Development.json, which .dockerignore keeps out of the image.
      Database__AutoMigrate: "true"
      # spec/23-mcp-server.md NFR-05 — on for the local stack so the MCP surface can be exercised
      # during development. Production stays default-off until a deployment enables it deliberately.
      Mcp__Enabled: "true"
    volumes:
      - file-storage:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Dev_OnlyPassw0rd!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
  file-storage:
